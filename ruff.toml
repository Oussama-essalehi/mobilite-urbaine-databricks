line-length = 140
target-version = "py311"

[lint]
select = ["E", "F", "I"]
# notebooks Databricks : `spark`, `dbutils`, `display` sont injectés par le runtime ;
# imports après les cellules %pip ; plusieurs instructions sur une ligne pour les graphiques
ignore = ["E402", "E701", "E702", "E731", "I001"]

[lint.per-file-ignores]
"src/0*.py" = ["F821"]
