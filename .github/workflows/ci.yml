name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pytest ruff pyyaml
      - name: Lint
        run: ruff check src tests dashboard scripts
      - name: Tests unitaires
        run: pytest -q

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe YAML du bundle
        run: python -c "import yaml; yaml.safe_load(open('databricks.yml'))"
