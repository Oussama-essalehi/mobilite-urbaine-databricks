[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
showWidgetBorder = true
baseRadius = "medium"

[theme.sidebar]
backgroundColor = "#ffffff"

[client]
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
